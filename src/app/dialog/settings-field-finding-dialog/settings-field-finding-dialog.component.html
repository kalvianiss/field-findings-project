<div
  class="box-container-content"
  fxLayout="column"
  fxLayoutAlign="start stretch"
  fxLayoutGap="10px"
>   
    <div
    class="fw-bold f-16 pxy-15"
    fxLayout="column"
    fxLayoutAlign="start stretch"
    fxLayoutGap="10px"
    >
        <div> Settings </div>
        <mat-divider></mat-divider>
    </div>

    <div
    class="box-content-modal pxy-15"
    fxLayout="column"
    fxLayoutAlign="start stretch"
    fxLayoutGap="36px"
    >
        <div
        fxLayout="row"
        fxLayoutAlign="start stretch"
        fxLayoutGap="36px"
        >
            <ngx-dropzone
            class="upload-profile"
            [accept]="'image/jpeg'"
            [maxFileSize]="5242880"
            [accept]="'image/jpeg'"
            [multiple]="'false'"
            (change)="updateUserImage($event, 'logo1')"
            >
            <ngx-dropzone-label
                #tooltip="matTooltip"
                matTooltip="Upload Logo"
            >
                <label class="text-muted">Upload Logo (Left)</label>
            </ngx-dropzone-label>
            <ngx-dropzone-image-preview
                class="profile-company"
                *ngIf="file"
                [removable]="true"
                [file]="file"
                (removed)="onRemoveUserImage('logo1')"
            >
                <ngx-dropzone-label></ngx-dropzone-label>
            </ngx-dropzone-image-preview>
            </ngx-dropzone>

            <ngx-dropzone
            class="upload-profile"
            [accept]="'image/jpeg'"
            [maxFileSize]="5242880"
            [accept]="'image/jpeg'"
            [multiple]="'false'"
            (change)="updateUserImage($event, 'logo2')"
            >
            <ngx-dropzone-label
                #tooltip="matTooltip"
                matTooltip="Upload Logo"
            >
                <label class="text-muted">Upload Logo (Right)</label>
            </ngx-dropzone-label>
            <ngx-dropzone-image-preview
                class="profile-company"
                *ngIf="file2"
                [removable]="true"
                [file]="file2"
                (removed)="onRemoveUserImage('logo2')"
            >
                <ngx-dropzone-label></ngx-dropzone-label>
            </ngx-dropzone-image-preview>
            </ngx-dropzone>
        </div>
        <div
        fxLayout="column"
        fxLayoutAlign="start stretch"
        fxLayoutGap="10px">
            <div
            fxLayout="row"
            fxLayoutAlign="space-between center"
            fxLayoutGap="10px"
            >
                <div>Signature List:</div>
            </div>
            <div
            fxLayout="row"
            fxLayoutAlign="start center"
            fxLayoutGap="10px"
            fxFlex
            *ngFor="let x of form.signatureList; let idx = index"
            >
                <app-input fxFlex="45%" [label]="'Name'" class="td-input" [control]="x.signature"></app-input>
                <app-input fxFlex="45%" [label]="'Position'" class="td-input" [control]="x.position"></app-input>
                <div
                fxLayout="row"
                fxLayoutAlign="center center"
                fxLayoutGap="10px"
                fxFlex="10%" 
                class="button-add-new"
                *ngIf="idx === 0"
                (click)="addNewRowData()"
                >
                    <mat-icon svgIcon="add-icon"></mat-icon>
                </div>
                <div
                fxLayout="row"
                fxLayoutAlign="center center"
                fxLayoutGap="10px"
                fxFlex="10%" 
                class="button-add-new"
                *ngIf="idx > 0"
                (click)="form.removeNewListCustom(idx)"
                >
                    <mat-icon svgIcon="delete"></mat-icon>
                </div>
            </div>
        </div>
    </div>
    
    <app-button-plus-minus
    [btnAdd]="true"
    (dialogClose)="dialogRef.close()"
    [customCancel]="'Close'"
    (submit)="submit()"
    [customAdd]="'Save'"
    >
    </app-button-plus-minus>
</div>
